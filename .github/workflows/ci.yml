name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Campaign (OVERRIDE GM Tool) ──
      - name: Install campaign deps
        run: npm ci

      - name: Typecheck (campaign)
        run: npm run typecheck

      # Extract the bundled unit library so the record-sheet derivation tests
      # (src/roster) run for real instead of skipping. Uses only node + unzip.
      - name: Extract unit library
        run: npm --prefix cards run extract-units

      - name: Test (campaign)
        run: npm test

      # ── Embedded card builder / battle tracker ──
      - name: Install card builder deps
        run: npm --prefix cards ci

      - name: Test (card builder)
        run: npm --prefix cards test

      # Proves the battle tracker builds from a clean checkout (extract-units
      # needs `unzip`, preinstalled on ubuntu-latest) so /battle works on deploy.
      # Deps already installed above, so build directly rather than build:battle.
      - name: Build battle tracker
        run: npm --prefix cards run build:web

      - name: Check the build produced a servable app
        run: test -f cards/dist-web/index.html && test -f cards/dist-web/units-index.json

  # D-054: unzip-and-run release zips (server bundle + node runtime + unit library).
  # Runs on version tags and on demand; artifacts appear on the workflow run page,
  # and a tag push also publishes them as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix cards ci
      - run: npm --prefix cards run build:web
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: override-release-zips
          path: release/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # create the release, or attach assets if the tag/release already exists
        # (e.g. the user created it through the GitHub UI first)
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.zip --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" release/*.zip --clobber
